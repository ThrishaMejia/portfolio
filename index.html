<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Academic Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header noprint">
  <a class="brand" href="#intro">Academic Journal</a>
  <nav>
    <a href="#toc">Contents</a>
    <a href="#reflection">Reflection</a>
  </nav>
</header>

<main>
  <!-- 1. INTRODUCTION -->
  <section id="intro" class="block hero"></section>

  <!-- 2. TABLE OF CONTENTS -->
  <section id="toc" class="block">
    <h2>Table of Contents</h2>
    <div class="toolbar noprint">
      <button class="btn" data-act="add-week">+ Add Week</button>
      <button class="btn primary" data-act="add-activity">+ Add Activity</button>
      <button class="btn" data-act="print-all">Save Full Portfolio as PDF</button>
    </div>
    <div id="tocList"></div>
  </section>

  <!-- 3. ACTIVITY ENTRIES -->
  <section id="entries"></section>

  <!-- 4. OVERALL REFLECTION -->
  <section id="reflection" class="block"></section>
</main>

<footer class="site-footer noprint">
  <p>Academic Portfolio &middot; <span id="year"></span></p>
  <p class="small">Your changes are saved in this browser only.
    <button class="link" data-act="backup">Download backup</button> &middot;
    <button class="link" data-act="restore">Restore backup</button></p>
  <input type="file" id="restoreFile" accept=".json" hidden>
</footer>

<!-- Activity form -->
<dialog id="actDialog">
  <form id="actForm">
    <h3 id="actTitle">Add Activity</h3>
    <label>Week number <input type="number" id="fWeek" min="1" required></label>
    <label>Activity type
      <select id="fType"><option>Laboratory</option><option>Lecture</option></select></label>
    <label>Date <input type="date" id="fDate" required></label>
    <label>Activity name <input type="text" id="fName" required></label>
    <label>Photos <input type="file" id="fPhotos" accept="image/*" multiple></label>
    <div id="photoPrev" class="thumbs"></div>
    <label>Description <textarea id="fDesc" rows="4"></textarea></label>
    <label>Reflection <textarea id="fRef" rows="4"></textarea></label>
    <div class="row">
      <button type="button" class="btn" id="actCancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<!-- Generic editor (intro & overall reflection) -->
<dialog id="edDialog">
  <form id="edForm">
    <h3 id="edTitle"></h3>
    <div id="edFields"></div>
    <div class="row">
      <button type="button" class="btn" id="edCancel">Cancel</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
  </form>
</dialog>

<script src="script.js"></script>
</body>
</html>
